name: 🧪 CI Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 🎨 Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter git-pulse-server prisma:generate

      - name: Code Formatting Check
        run: pnpm format:check

      - name: ESLint Check
        run: pnpm lint

      - name: TypeScript Typecheck
        run: pnpm typecheck

  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter git-pulse-server prisma:generate

      - name: Run Jest Test Suite
        run: pnpm test

  build:
    name: 📦 Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter git-pulse-server prisma:generate

      - name: Build All Workspaces
        run: pnpm build

  notify-ci:
    name: 📢 Notify Slack (#ci-cd)
    needs: [quality, unit-tests, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send CI status to Central Gateway
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL || 'https://central-gateway-server.vercel.app/api/v1' }}
          GATEWAY_SECRET_KEY: ${{ secrets.GATEWAY_SECRET_KEY }}
          QUALITY_STATUS: ${{ needs.quality.result }}
          UNIT_STATUS: ${{ needs.unit-tests.result }}
          BUILD_STATUS: ${{ needs.build.result }}
        run: |
          if [ -z "$GATEWAY_SECRET_KEY" ]; then
            echo "GATEWAY_SECRET_KEY not configured; skipping CI notification."
            exit 0
          fi

          OVERALL_STATUS="FAIL"
          if [ "$QUALITY_STATUS" = "success" ] && [ "$UNIT_STATUS" = "success" ] && [ "$BUILD_STATUS" = "success" ]; then
            OVERALL_STATUS="SUCCESS"
          fi

          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          COMMIT="${{ github.sha }}"
          AUTHOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"

          Q_UP=$(echo "$QUALITY_STATUS" | tr "[:lower:]" "[:upper:]")
          U_UP=$(echo "$UNIT_STATUS" | tr "[:lower:]" "[:upper:]")
          B_UP=$(echo "$BUILD_STATUS" | tr "[:lower:]" "[:upper:]")

          PAYLOAD=$(jq -n \
            --arg project "git-pulse" \
            --arg status "$OVERALL_STATUS" \
            --arg branch "$REF" \
            --arg commit "$COMMIT" \
            --arg trigger "$EVENT by @$AUTHOR" \
            --arg quality "$Q_UP" \
            --arg unit "$U_UP" \
            --arg build "$B_UP" \
            --arg runUrl "$RUN_URL" \
            '{
              project: $project,
              status: $status,
              branch: $branch,
              commit: $commit,
              trigger: $trigger,
              pipeline: {
                "Quality & Types": $quality,
                "Unit Tests": $unit,
                "Production Build": $build
              },
              runUrl: $runUrl
            }')

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$GATEWAY_URL/notifications/slack/ci" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GATEWAY_SECRET_KEY" \
            -d "$PAYLOAD") || {
              echo "::warning::CI notification request to Central Gateway failed."
              exit 0
            }

          HTTP_CODE=$(printf '%s\n' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s\n' "$RESPONSE" | sed '$d')
          echo "Central Gateway CI notification response: HTTP $HTTP_CODE $BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::Central Gateway CI notification returned HTTP $HTTP_CODE"
          fi
